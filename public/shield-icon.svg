  <path d="M50 20 L75 31 V50 C75 64 64 75 50 81 C36 75 25 64 25 50 V31 L50 20Z" 
        stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="3 2" fill="none" opacity="0.6" />
  <!-- Circuit nodes -->
  <circle cx="50" cy="40" r="4" fill="#00E5FF" />
  <circle cx="40" cy="55" r="3.5" fill="#39FF88" />
  <circle cx="60" cy="55" r="3.5" fill="#39FF88" />
  <circle cx="50" cy="68" r="3" fill="#8B5CF6" />
  <!-- Connecting lines -->
  <path d="M50 40 L40 55 M50 40 L60 55 M40 55 L50 68 M60 55 L50 68" 
